name: SpendWise CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Analyze and Test ──────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true  # Cache Flutter SDK for faster builds

      - name: Install dependencies
        run: flutter pub get

      - name: Create firebase_options.dart
        # Recreate from GitHub Secret — needed here too, since main.dart imports it
        run: echo '${{ secrets.FIREBASE_OPTIONS }}' > lib/firebase_options.dart

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  # ── Job 2: Build APK ─────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze  # Only runs if analyze passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create google-services.json
        # Recreate from GitHub Secret — never commit this file
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create firebase_options.dart
        # Recreate from GitHub Secret
        run: echo '${{ secrets.FIREBASE_OPTIONS }}' > lib/firebase_options.dart

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-release-apk
          # Path to the built APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30  # Keep for 30 days